name: ORDIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Python Engine (Ruff, mypy, pytest, OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy strict typecheck
        run: uv run mypy engine tests scripts
      - name: pytest
        run: uv run pytest
      - name: Verify OpenAPI export freshness
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code ../../packages/contracts/openapi.json

  web:
    name: Web & Contracts (ESLint, TypeScript, Vitest, Contract Freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI TypeScript contract freshness
        run: pnpm contracts:check
      - name: Generate Prisma client
        run: pnpm --filter @ordiq/web db:generate
      - name: Lint (including architectural import boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit & boundary tests
        run: pnpm test
      - name: Build Next.js production bundle
        env:
          DATABASE_URL: postgresql://ordiq:ordiq_dev_password@localhost:5432/ordiq?schema=public
          AUTH_SECRET: ci-auth-secret-change-in-production-32chars
          APP_ENCRYPTION_KEY: ci-encryption-key-change-in-prod-32c
          ENGINE_URL: http://localhost:8000
          ENGINE_TOKEN: ci-engine-shared-secret-token-32chars
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
          LLM_API_KEY: sk-ci-placeholder
          LLM_MONTHLY_TOKEN_BUDGET: "500000"
        run: pnpm build

  docker:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build engine and web Docker images
        run: docker compose build

